<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="18" y1="6" x2="110" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a72ee"/>
      <stop offset="0.48" stop-color="#5840ba"/>
      <stop offset="1" stop-color="#3a2794"/>
    </linearGradient>
    <radialGradient id="glow" cx="34" cy="18" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="64" y1="26" x2="64" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e3ff"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1c0f5c" flood-opacity="0.38"/>
    </filter>
    <clipPath id="tile">
      <rect x="4" y="4" width="120" height="120" rx="30"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#glow)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="1.5"/>

  <g clip-path="url(#tile)">
    <!-- The queue: two more saved videos fanned out behind the front one -->
    <path d="M50 27h28a10 10 0 0 1 10 10v59.4a3.6 3.6 0 0 1-5.8 2.9L64 85 45.8 99.3a3.6 3.6 0 0 1-5.8-2.9V37a10 10 0 0 1 10-10Z"
          fill="#fff" fill-opacity="0.2" transform="rotate(-24 64 104) translate(-3 2)"/>
    <path d="M50 27h28a10 10 0 0 1 10 10v59.4a3.6 3.6 0 0 1-5.8 2.9L64 85 45.8 99.3a3.6 3.6 0 0 1-5.8-2.9V37a10 10 0 0 1 10-10Z"
          fill="#fff" fill-opacity="0.42" transform="rotate(-12 64 104) translate(-1 1)"/>

    <!-- The bookmark you just saved, with a play button cut out of it -->
    <g filter="url(#lift)">
      <path d="M52 25h28a10 10 0 0 1 10 10v59.4a3.6 3.6 0 0 1-5.8 2.9L66 83 47.8 97.3a3.6 3.6 0 0 1-5.8-2.9V35a10 10 0 0 1 10-10Z"
