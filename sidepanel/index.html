<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Watchlist</title>

    <link rel="stylesheet" href="styles.css" />

    <!--
      Tailwind's Play CDN build. Manifest V3 forbids loading scripts from a remote
      origin, so the CDN script is shipped inside the extension (vendor/) and its
      config lives in its own file rather than an inline <script>.
    -->
    <script src="../vendor/tailwindcss.js"></script>
    <script src="tailwind.config.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Filled at startup with every class the app can use, so Tailwind compiles them up front. -->
    <div id="tw-warm" hidden aria-hidden="true"></div>

    <script src="../vendor/react.production.min.js"></script>
    <script src="../vendor/react-dom.production.min.js"></script>
    <script src="vendor-bridge.js"></script>
    <script src="../vendor/framer-motion.js"></script>
    <script src="../vendor/lucide-react.min.js"></script>
    <script src="../vendor/htm.umd.js"></script>
    <script src="../shared/core.js"></script>
    <script src="app.js"></script>
  </body>
</html>
